name: Pylint and test coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test and lint dependencies
        run: |
          python -m pip install -e '.[test]'
          python -m pip install pylint
      - name: Run tests and measure coverage
        run: python -m pytest -q tests --cov=mobile_network_sim --cov-report=term-missing --cov-report=json:coverage.json
      - name: Measure Pylint score
        shell: bash
        run: |
          python -m pylint src/mobile_network_sim --exit-zero | tee pylint.txt
          score=$(sed -n 's/.*rated at \([-0-9.]*\)\/10.*/\1/p' pylint.txt | tail -n 1)
          if [ -z "$score" ]; then
            echo "Could not extract Pylint score."
            exit 1
          fi
          echo "PYLINT_SCORE=$score" >> "$GITHUB_ENV"
      - name: Generate badge data
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          coverage = json.loads(Path("coverage.json").read_text(encoding="utf-8"))
          percent = float(coverage["totals"]["percent_covered"])
          score = float(os.environ["PYLINT_SCORE"])

          def color(value, limits):
              for threshold, name in limits:
                  if value >= threshold:
                      return name
              return "red"

          public = Path("public")
          public.mkdir(exist_ok=True)
          badges = {
              "coverage-badge.json": {
                  "schemaVersion": 1,
                  "label": "test coverage",
                  "message": f"{percent:.1f}%",
                  "color": color(percent, [(90, "brightgreen"), (80, "green"), (70, "yellowgreen"), (60, "yellow"), (50, "orange")]),
              },
              "pylint-badge.json": {
                  "schemaVersion": 1,
                  "label": "pylint",
                  "message": f"{score:.2f}/10",
                  "color": color(score, [(9.5, "brightgreen"), (9, "green"), (8, "yellowgreen"), (7, "yellow"), (5, "orange")]),
              },
          }
          for filename, payload in badges.items():
              (public / filename).write_text(json.dumps(payload), encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write(f"Pylint: {score:.2f}/10  \nTest coverage: {percent:.1f}%\n")
          PY
      - name: Upload badge data
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
